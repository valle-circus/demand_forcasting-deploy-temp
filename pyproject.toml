[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-planning"
version = "0.1.0"
description = "Deterministic Phase 2 supply-planning engine and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
pdf-import = ["pdfplumber>=0.11,<1"]

[project.scripts]
supply-plan = "supply_planning.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
